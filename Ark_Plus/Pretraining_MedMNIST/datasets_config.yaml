# MedMNIST+ (224x224) datasets for Ark+ pretraining.
# <DATA_ROOT> is replaced at run time by --data_root (see main_ark.py).
# train_list / val_list / test_list hold the split name; the MedMNIST loader reads
# <data_dir>/<split>_images.npy and <data_dir>/<split>_labels.npy.
# Official MedMNIST splits are used unchanged (train for training, val for
# validation/early stopping, test only for reporting).

ChestMNIST:
  data_dir: <DATA_ROOT>/chestmnist
  train_list: train
  val_list: val
  test_list: test
  diseases: ['atelectasis', 'cardiomegaly', 'effusion', 'infiltration', 'mass', 'nodule', 'pneumonia', 'pneumothorax', 'consolidation', 'edema', 'emphysema', 'fibrosis', 'pleural', 'hernia']
  task_type: multi-label classification

DermaMNIST:
  data_dir: <DATA_ROOT>/dermamnist
  train_list: train
  val_list: val
  test_list: test
  diseases: ['actinic_keratoses', 'basal_cell_carcinoma', 'benign_keratosis', 'dermatofibroma', 'melanoma', 'melanocytic_nevi', 'vascular_lesions']
  task_type: multi-class classification

# RetinaMNIST is labelled "ordinal regression" in MedMNIST; the MedMNIST benchmark
# and evaluator treat it as 5-class classification, so it is multi-class here too.
RetinaMNIST:
  data_dir: <DATA_ROOT>/retinamnist
  train_list: train
  val_list: val
  test_list: test
  diseases: ['grade_0', 'grade_1', 'grade_2', 'grade_3', 'grade_4']
  task_type: multi-class classification

# Binary, one output like Shenzhen in the original config. MedMNIST label 1 means
# "normal, benign" and 0 means "malignant"; the label is kept as is so the AUC
# matches the MedMNIST evaluator (which scores class 1).
BreastMNIST:
  data_dir: <DATA_ROOT>/breastmnist
  train_list: train
  val_list: val
  test_list: test
  diseases: ['normal_or_benign']
  task_type: binary classification

# ---------------------------------------------------------------------------
# MedMNIST+ 3D (64x64x64). The Ark+ model is unchanged: each volume is reduced
# to one three-channel image in the loader (see MedMNIST3D in dataloader.py).
# ---------------------------------------------------------------------------

OrganMNIST3D:
  data_dir: <DATA_ROOT>/organmnist3d
  train_list: train
  val_list: val
  test_list: test
  diseases: ['liver', 'kidney_right', 'kidney_left', 'femur_right', 'femur_left', 'bladder', 'heart', 'lung_right', 'lung_left', 'spleen', 'pancreas']
  task_type: multi-class classification

FractureMNIST3D:
  data_dir: <DATA_ROOT>/fracturemnist3d
  train_list: train
  val_list: val
  test_list: test
  diseases: ['buckle_rib_fracture', 'nondisplaced_rib_fracture', 'displaced_rib_fracture']
  task_type: multi-class classification

# MedMNIST label 1 is "excitatory synapse"; kept as is so AUC matches the evaluator.
SynapseMNIST3D:
  data_dir: <DATA_ROOT>/synapsemnist3d
  train_list: train
  val_list: val
  test_list: test
  diseases: ['excitatory_synapse']
  task_type: binary classification

NoduleMNIST3D:
  data_dir: <DATA_ROOT>/nodulemnist3d
  train_list: train
  val_list: val
  test_list: test
  diseases: ['malignant']
  task_type: binary classification

AdrenalMNIST3D:
  data_dir: <DATA_ROOT>/adrenalmnist3d
  train_list: train
  val_list: val
  test_list: test
  diseases: ['adrenal_mass']
  task_type: binary classification

VesselMNIST3D:
  data_dir: <DATA_ROOT>/vesselmnist3d
  train_list: train
  val_list: val
  test_list: test
  diseases: ['aneurysm']
  task_type: binary classification
